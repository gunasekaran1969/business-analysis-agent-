<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Business Analysis AI Agent</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="header">
  <h1>🤖 Business Analysis AI Agent</h1>
  <p>Sales Intelligence Dashboard</p>
</header>

<main class="container">

  <section class="card">
    <h2>📁 Load Sales Data</h2>
    <p>Our sample file is <strong>sales-transactions-1000.csv</strong></p>

    <input type="file" id="csvFileInput" accept=".csv" />
    <button id="loadSampleBtn">Load Sample Dataset</button>

    <p id="loadStatus" class="status"></p>
  </section>

  <section class="card">
    <h2>💬 Ask a Question</h2>
    <textarea id="questionInput" placeholder="e.g. Which region had the highest sales?"></textarea>
    <button id="askBtn">Analyze</button>

    <div id="answerBox" class="answer"></div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
